<div class="color-grid">
  @for (preset of presetColors; track preset) {
    <button
      type="button"
      class="color-option"
      [attr.aria-pressed]="color === preset"
      [title]="preset"
      (click)="selectColor(preset)"
    >
      <span
        class="swatch"
        [style.background-color]="preset"
        [class.selected]="color === preset"
      ></span>
    </button>
  }
  <button
    type="button"
    class="color-option"
    [attr.aria-pressed]="!color"
    (click)="selectColor(null)"
  >
    <span class="swatch no-color-option" [class.selected]="!color">
      <ion-icon name="ban-outline"></ion-icon>
    </span>
  </button>
</div>
<ion-item class="hex-input-item" lines="none">
  <ion-input
    label="#"
    [(ngModel)]="customHexValue"
    (ionInput)="onCustomHexInput()"
    placeholder="ff6600"
    maxlength="6"
  ></ion-input>
</ion-item>
