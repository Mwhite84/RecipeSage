<div class="container">
  <ion-icon name="pin-outline" class="pin"></ion-icon>
  <div class="item-container">
    @for (
      pinnedRecipe of cookingToolbarService.pinnedRecipes;
      track pinnedRecipe
    ) {
      <button
        class="item ion-activatable"
        (click)="openRecipe(pinnedRecipe)"
        [attr.aria-label]="'Open ' + pinnedRecipe.title"
        type="button"
      >
        @if (pinnedRecipe.imageUrl) {
          <img
            [src]="pinnedRecipe.imageUrl"
            [alt]="pinnedRecipe.title"
            loading="lazy"
          />
        }
        @if (!pinnedRecipe.imageUrl) {
          <img
            src="assets/imgs/logo_green.png"
            [alt]="pinnedRecipe.title"
            class="placeholder"
          />
        }
        <div class="letter">
          {{ pinnedRecipe.title.substring(0, 1).toUpperCase() }}
        </div>
        <ion-ripple-effect></ion-ripple-effect>
      </button>
    }
  </div>
  <button
    (click)="clearPins()"
    class="close"
    type="button"
    aria-label="Clear pinned recipes"
  >
    <ion-icon name="close-outline" size="large" aria-hidden="true"></ion-icon>
  </button>
</div>
